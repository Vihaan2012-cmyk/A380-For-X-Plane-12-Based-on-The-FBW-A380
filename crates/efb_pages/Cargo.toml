[package]
name = "efb_pages"
version = "0.1.0"
edition = "2021"
description = "Native EFB page trees (Home, Settings) built from EFB state, painted by the a380-displays DomDisplay"
publish = false

[lib]
doctest = false

[dependencies]
mfd_tree = { path = "../mfd_tree" }
fws_ecl = { path = "../fws_ecl", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"

[workspace]
