[package]
name = "fws_ecl"
version = "0.1.0"
edition = "2021"
description = "FlyByWire's A380X normal procedures, memo, limitation and status data as native Rust, without any simulator dependency"
license = "GPL-3.0-or-later"

[features]
serde = ["dep:serde"]

[dependencies]
fws_data = { path = "../fws_data" }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[workspace]
