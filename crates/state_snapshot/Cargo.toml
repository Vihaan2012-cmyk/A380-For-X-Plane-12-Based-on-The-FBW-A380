[package]
name = "state_snapshot"
version = "0.1.0"
edition = "2021"
description = "Versioned, sectioned, compressed whole-aircraft state snapshots for the A380 for X-Plane 12: format, migration, atomic write, save slots"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"

[workspace]
